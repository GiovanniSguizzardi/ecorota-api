# Execucao local: SQL Server + API. Uso: docker compose up --build
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-EcoRota@Local123}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"IF DB_ID('ecorota') IS NULL CREATE DATABASE ecorota\" || exit 1"]
      interval: 10s
      retries: 10

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=ecorota;encrypt=true;trustServerCertificate=true
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD:-EcoRota@Local123}
    ports:
      - "8080:8080"
