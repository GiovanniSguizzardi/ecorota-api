spring.application.name=ecorota-api
server.port=${PORT:8080}

# Credenciais SEMPRE via variaveis de ambiente (nunca commitar senha)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ecorota;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Nao expor detalhes internos nos erros
server.error.include-stacktrace=never
server.error.include-message=never

springdoc.swagger-ui.path=/swagger-ui.html
